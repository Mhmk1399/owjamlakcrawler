name: owj-market-analytics

services:
  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: owj-market-analytics
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      ANALYTICS_HOST: 0.0.0.0
      ANALYTICS_PORT: 4567
      ANALYTICS_AUTO_CRAWL: "true"
      ANALYTICS_HEADLESS: "true"
    ports:
      - "4567:4567"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4567/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
